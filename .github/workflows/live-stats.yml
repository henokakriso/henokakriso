name: live-stats

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate live status SVGs
        run: python3 scripts/update-stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed assets
        run: |
          git config user.name "henokakriso"
          git config user.email "henokakriso@users.noreply.github.com"
          git add assets/github
          git diff --cached --quiet || {
            git commit -m "chore: refresh live GitHub stats [skip ci]"
            git push
          }
          echo "no changes, nothing to commit"